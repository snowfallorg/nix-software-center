[package]
name = "nix-software-center"
authors = ["Victor Fuentes <vlinkz@snowflakeos.org>"]
edition = "2024"
version = "0.2.0-alpha.1"

[profile.release]
lto = true

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_10"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "brotli"] }
libsnow = { git = "https://github.com/snowfallorg/libsnow" }
libappstream = { git = "https://gitlab.gnome.org/vlinkz/libappstream-rs.git", branch = "0.5" }
gio-unix = "0.22"
async-channel = "2"
rand = "0.10"
quick-xml = "0.39"
spdx = { version = "0.13", features = ["text"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
